<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="'UFC.GG - ' + ${vote.title}">투표 상세</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/vote_detail.css}">
</head>
<body style="background-color: #000;">

<header th:replace="~{layout/header::header}"></header>

<div class="vote-page-wrapper">

    <div class="side-fighter-card red-corner">
        <div class="img-container">
            <img th:src="${f1Img != null && f1Img != '' ? f1Img : '/images/default_fighter.png'}"
                 onerror="this.src='/images/default_fighter.png'"
                 alt="RED Fighter">
        </div>
        <div class="fighter-name" th:text="${vote.fighter1Name}"></div>
        <div class="corner-tag red">RED CORNER</div>
    </div>

    <div class="main-content-container">
        <div class="match-info-header">
            <h1 class="match-title" th:text="${vote.title}"></h1>
            <div class="match-status" th:text="${vote.closed ? '투표 마감' : '진행중'}"
                 th:style="${vote.closed ? 'color:#ff4444' : 'color:#00ff00'}"></div>
        </div>

        <div class="voting-area">
            <button type="button" class="btn-select red"
                    th:disabled="${vote.closed || hasVoted}"
                    th:onclick="castVote(1)"
                    th:text="${hasVoted ?'투표 완료': 'SELECT RED'}"></button>

            <div class="vs-divider">VS</div>

            <button type="button" class="btn-select blue"
                    th:disabled="${vote.closed || hasVoted}"
                    th:onclick="castVote(2)"
                    th:text="${hasVoted ?'투표 완료': 'SELECT BLUE'}"></button>
        </div>

        <div class="vote-stats-box">
            <div class="gauge-bar-wrapper">
                <div class="gauge-fill red" th:style="'width:' + ${f1Rate} + '%'"></div>
                <div class="gauge-fill blue" th:style="'width:' + ${f2Rate} + '%'"></div>
            </div>
            <div class="gauge-labels">
                <span th:text="${f1Rate} + '% ( ' + ${vote.fighter1Votes} + '표 )'"></span>
                <span th:text="${f2Rate} + '% ( ' + ${vote.fighter2Votes} + '표 )'"></span>
            </div>
        </div>



        <div class="post-detail-section">
            <div class="section-label">🥊 경기 분석 및 게시글 내용</div>
            <div class="main-match-banner" th:if="${vote.voteImagePath != null}">
                <img th:src="${vote.voteImagePath}" alt="Match Poster" style="width: 100%; max-height: 400px; object-fit: cover;">
            </div>
            <div class="post-text-content" th:text="${vote.content}"></div>
        </div>

        <div class="analysis-btn-container" th:if="${vote.closed && totalPrediction != null}" id="analysisBtnArea">
            <button type="button" class="btn-show-analysis" onclick="toggleAnalysis()">
                🔍 종합 예측 결과(AI + 유저) 확인하기
            </button>
        </div>

        <div id="analysisResultView" class="prediction-result-box" style="display: none;" th:if="${totalPrediction != null}">
            <div class="section-label" style="color: #ffc107;">🏆 딥러닝 종합 예측 결과</div>

            <div class="combined-gauge-wrapper">
                <div class="combined-fill fighter1"
                     th:style="'width:' + (${totalPrediction.combineScore != null ? totalPrediction.combineScore : 0.5} * 100) + '%'"></div>
                <div class="combined-fill fighter2"
                     th:style="'width:' + (100 - (${totalPrediction.combineScore != null ? totalPrediction.combineScore : 0.5} * 100)) + '%'"></div>
            </div>

            <div class="prediction-labels">
                <div class="p-label red">
                    <span th:text="${vote.fighter1Name}">RED</span> 승리 확률:
                    <span class="percent-text"
                          th:text="${totalPrediction.combineScore != null ? #numbers.formatDecimal(totalPrediction.combineScore * 100, 1, 1) + '%' : '계산 중...'}"></span>
                </div>
                <div class="p-label blue">
                    <span th:text="${vote.fighter2Name}">BLUE</span> 승리 확률:
                    <span class="percent-text"
                          th:text="${totalPrediction.combineScore != null ? #numbers.formatDecimal((1 - totalPrediction.combineScore) * 100, 1, 1) + '%' : '계산 중...'}"></span>
                </div>
            </div>
        </div>

        <div class="navigation-footer">
            <a th:href="@{/vote/vlist}" class="btn-back">← 목록으로 돌아가기</a>

            <div sec:authorize="hasRole('ROLE_ADMIN')" class="admin-controls">
                <button type="button" th:if="${!vote.closed}"
                        th:onclick="closeVote([[${vote.boardNum}]])"
                        class="btn-close-vote">🚫 투표 마감</button>

                <a th:href="@{'/vote/voteEdit/'+${vote.boardNum}}" class="btn-edit">📝편집</a>
            </div>
        </div>
    </div>

    <div class="side-fighter-card blue-corner">
        <div class="img-container">
            <img th:src="${f2Img != null && f2Img != '' ? f2Img : '/images/default_fighter.png'}"
                 onerror="this.src='/images/default_fighter.png'"
                 alt="BLUE Fighter">
        </div>
        <div class="fighter-name" th:text="${vote.fighter2Name}"></div>
        <div class="corner-tag blue">BLUE CORNER</div>
    </div>

</div>

<footer th:replace="~{layout/footer::footer}"></footer>

</body>

<script th:inline="javascript">
    function castVote(fighterNum){
        const boardNum = [[${vote.boardNum}]];
        fetch(`/vote/doVote/${boardNum}?fighterNum=${fighterNum}`,{
            method:'POST'
        })
        .then(async response => {
            if (response.ok){
                alert("투표가 성공적으로 반영되었습니다!");
                location.reload();
            } else{
                const errorMsg = await response.text();
                alert(errorMsg);
            }
        })
        .catch(error => {
            console.error('Error', error);
            alert("서버 통신 중 오류가 발생했습니다.");
        });
   }

    function closeVote(boardNum){
        if(!confirm("정말로 이 투표를 마감하시겠습니까?")) return;

        fetch(`/vote/close/${boardNum}`, { // 경로 뒤에 바로 붙임
             method: 'POST',

        })
        .then(response => {
            if(response.ok){
                alert("투표가 마감되었습니다.");
                location.reload();
            } else{
                // 실패했을 때만 에러 메시지를 노출
                return response.text().then(text => { throw new Error(text) });
            }
        })
        .catch(error => {
            console.error('ERROR', error);
            // error.message를 띄워서 실제 에러 원인(500 에러 등)을 확인합니다.
            alert("알림: " + error.message);
        });
    }

    function toggleAnalysis(){
        const resultView = document.getElementById('analysisResultView');
        const btnArea = document.getElementById('analysisBtnArea');
        if(resultView){
            resultView.style.display = 'block';
            btnArea.style.display = 'none';
            resultView.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
</script>
</html>
