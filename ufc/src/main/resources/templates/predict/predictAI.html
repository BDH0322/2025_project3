<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC AI 예측 | ufcgg</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <link rel="stylesheet" th:href="@{/css/predictAI.css}">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header th:replace="~{layout/header::header}"></header>


<main class="main-container">
    <aside class="sidebar left-sidebar">
        <div id="f1-stat-card" class="stat-card blue-card hidden">
            <div class="img-wrapper">
                <img id="f1-image" src="@{/images/default_fighter.png}" alt="Fighter 1">
            </div>
            <div class="info-wrapper">
                <h3 id="f1-name-display">Fighter Name</h3>
                <p>🏆<span id="f1-rank-display">-</span></p>
                <p>🏆<span id="f1-record-display">-</span></p>
            </div>
        </div>
    </aside>

    <div class="center-content">
    <section id="weight-class-selection" class="selection-box">
        <h2>1. 체급을 선택하세요</h2>
        <select id="weight-class-select">
            <option value="" disabled selected>--- 체급 선택 ---</option>
            <option value="Heavyweight">Heavyweight (헤비급)</option>
            <option value="Light Heavyweight">LightHeavyweight (라이트헤비급)</option>
            <option value="Welterweight">Welterweight (웰터급)</option>
            <option value="Lightweight">Lightweight (라이트급)</option>
            <option value="Featherweight">Featherweight (페더급)</option>

        </select>
    </section>

    <div id="fighter-selection-area">
            <section id="fighter-selection" class="selection-box">
                <h2>2. 선수를 선택하세요</h2>
                <div class="fighter-selectors">

                    <div class="fighter-card blue-side">
                        <h3>BLUE CORNER (F1)</h3>
                        <select id="fighter1-select" disabled>
                            <option value="" disabled selected>선수 선택</option>
                        </select>
                        <div class="fighter-info" id="fighter1-info">체급 선택 후 활성화</div>
                    </div>

                    <span class="vs-label">VS</span>

                    <div class="fighter-card red-side">
                        <h3>RED CORNER (F2)</h3>
                        <select id="fighter2-select" disabled>
                            <option value="" disabled selected>선수 선택</option>
                        </select>
                        <div class="fighter-info" id="fighter2-info">체급 선택 후 활성화</div>
                    </div>
                </div>
            </section>

            <button id="analyze-button" disabled>⚔️ 분석하기</button>
        </div>


        <section id="result-area" class="hidden">
            <h2>🏆 예측 결과</h2>
            <div class="result-display">
                <div class="result-bar-container">
                    <div class="result-bar blue-bar" style="width: 50%;"></div>
                    <div class="result-bar red-bar" style="width: 50%;"></div>
                </div>
                <div class="result-text">
                    <p id="f1-prediction-text" class="blue-text">선수 F1 승리 확률: 50.00%</p>
                    <p id="f2-prediction-text" class="red-text">선수 F2 승리 확률: 50.00%</p>
                </div>
            </div>

        </section>
    </div> <aside class="sidebar right-sidebar">
        <div id="f2-stat-card" class="stat-card red-card hidden">
            <div class="img-wrapper">
                <img id="f2-image" src="@{/images/default_fighter.png}" alt="Fighter 2">
            </div>
            <div class="info-wrapper">
                <h3 id="f2-name-display">선수 이름</h3>
                <p>🏆 <span id="f2-rank-display">-</span></p>
                <p>🥊 <span id="f2-record-display">-</span></p>
            </div>
        </div>
    </aside>

</main>

    <footer th:replace="~{layout/footer::footer}"></footer>
    <script th:src="@{/js/predictAI.js}"></script>
</body>
</html>
